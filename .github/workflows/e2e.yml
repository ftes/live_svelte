name: E2E (example_project)

on:
  pull_request:
    branches: [master]

jobs:
  e2e:
    name: Wallaby E2E
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: example_project
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/cache@v4
        with:
          path: |
            example_project/deps
            example_project/_build
          key: ${{ runner.os }}-e2e-mix-${{ hashFiles('example_project/mix.lock') }}

      - name: Install dependencies
        run: mix deps.get && mix assets.setup

      - name: Compile
        run: mix compile

      - name: Run Wallaby E2E tests
        run: mix test --only e2e
